<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Transaction</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="center-box">
<h2>Create Transaction</h2>
<form onsubmit="createTransaction(event)">
<label>Amount</label>
<input type="number" id="amount" value="800">
<label>Description</label>
<input type="text" id="description" value="USD Payment">
<label>Role</label>
<select id="role">
<option>Seller</option>
<option>Buyer</option>
</select>
<label>Currency</label>
<select id="currency">
<option>USD</option>
</select>
<label>Buyer Email</label>
<input type="email" id="buyerEmail">
<button>Start Transaction</button>
</form>
</div>
<script src="script.js"></script>
</body>
</html>
